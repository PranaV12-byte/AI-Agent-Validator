version: "3.9"

# ── Production Docker Compose ──────────────────────────────────────────────────
# Usage:
#   cp .env.prod.example .env.prod        # fill in all required values
#   docker compose -f docker-compose.prod.yml up -d
#
# Required env vars (set in .env.prod or host environment):
#   DATABASE_URL, REDIS_URL, JWT_SECRET_KEY, CORS_ORIGINS
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#
# Optional:
#   ALGORAND_APP_ID, ALGORAND_MNEMONIC, SENTRY_DSN

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: backend/.env.prod
    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    restart: unless-stopped
    env_file: backend/.env.prod
    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL must be set}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  redis_data:
